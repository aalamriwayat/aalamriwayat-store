
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة تحكم عالم الروايات</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5eee8;
      color: #392535;
      margin: 0;
      padding: 20px;
    }
    main { max-width: 950px; margin: auto; }
    section, .order {
      background: white;
      padding: 18px;
      border-radius: 14px;
      margin: 14px 0;
    }
    input, textarea, button {
      padding: 12px;
      margin: 5px 0;
      border-radius: 8px;
      border: 1px solid #d8c5d0;
      font: inherit;
    }
    input, textarea {
      width: min(100%, 450px);
      box-sizing: border-box;
    }
    textarea { display: block; }
    button {
      cursor: pointer;
      background: #592b50;
      color: white;
      border: 0;
    }
    button:disabled { opacity: .5; cursor: wait; }
    .reject { background: #8c3434; }
    .muted { color: #776977; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    .book-card {
      border: 1px solid #e6d9e1;
      border-radius: 12px;
      padding: 14px;
      margin: 12px 0;
    }
    .book-card h3 { margin-top: 0; }
  </style>
</head>
<body>
<main>
  <h1>متجر عالم الروايات</h1>
  <p class="muted">لوحة تحكم المسؤول</p>

  <section id="login">
    <h2>تسجيل الدخول</h2>
    <input id="email" type="email" placeholder="البريد الإلكتروني"
      autocomplete="username" required>
    <br>
    <input id="password" type="password" placeholder="كلمة المرور"
      autocomplete="current-password" required>
    <br>
    <button id="loginBtn" onclick="login()">دخول</button>
    <p id="loginMsg"></p>
  </section>

  <section id="dashboard" hidden>
    <div class="row">
      <h2>الطلبات</h2>
      <button onclick="loadOrders()">تحديث الطلبات</button>
      <button onclick="logout()">تسجيل الخروج</button>
    </div>

    <p id="msg"></p>
    <div id="orders"></div>

    <hr>
    <h2>إدارة الروايات</h2>
    <p class="muted">يمكنك إضافة الروايات وتعديل معلوماتها ومخزونها.</p>

    <form id="bookForm">
      <input type="hidden" id="bookId">

      <p><input id="bookTitle" placeholder="اسم الرواية" required></p>
      <p><input id="bookAuthor" placeholder="اسم الكاتب"></p>
      <p><input id="bookPrice" type="number" min="0" step="0.01"
        placeholder="الثمن بالدرهم" required></p>
      <p><input id="bookStock" type="number" min="0" step="1"
        placeholder="الكمية في المخزون" required></p>
      <p><input id="bookCategory" placeholder="الصنف"></p>
      <p><label for="bookImageFile">صورة الرواية:</label></p>
      <p><input id="bookImageFile" type="file" accept="image/*"></p>
      <input id="bookImage" type="hidden">
      <p><textarea id="bookDescription" placeholder="ملخص الرواية"
        rows="4"></textarea></p>

      <div class="row">
        <button type="submit" id="saveBookBtn">إضافة الرواية</button>
        <button type="button" onclick="resetBookForm()">إلغاء التعديل</button>
      </div>
    </form>

    <p id="booksMsg"></p>
    <div id="booksList"></div>
  </section>
</main>

<script>
const SUPABASE_URL = "https://scngjvksfjrkfouizizt.supabase.co";
const SUPABASE_KEY = "sb_publishable_Vc3-3epAb80iIvGKNRdYag_1ugI1T2g";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const el = id => document.getElementById(id);

async function login() {
  el("loginMsg").textContent = "جارٍ تسجيل الدخول...";
  el("loginBtn").disabled = true;

  try {
    const { error } = await db.auth.signInWithPassword({
      email: el("email").value.trim(),
      password: el("password").value
    });

    if (error) {
      el("loginMsg").textContent = "تعذر الدخول: " + error.message;
      return;
    }

    await checkSession();
  } catch (error) {
    el("loginMsg").textContent = "وقع خطأ أثناء الدخول.";
  } finally {
    el("loginBtn").disabled = false;
  }
}

async function logout() {
  const { error } = await db.auth.signOut();

  if (error) {
    el("msg").textContent = "تعذر تسجيل الخروج: " + error.message;
    return;
  }

  el("dashboard").hidden = true;
  el("login").hidden = false;
  el("orders").replaceChildren();
  el("booksList").replaceChildren();
  el("password").value = "";
}

async function checkSession() {
  const { data: { session }, error: sessionError } =
    await db.auth.getSession();

  if (sessionError || !session) {
    el("login").hidden = false;
    el("dashboard").hidden = true;
    return;
  }

  const { data, error } = await db.rpc("is_admin");

  if (error || data !== true) {
    el("loginMsg").textContent =
      "هذا الحساب غير مخوّل للوصول إلى لوحة التحكم.";
    await db.auth.signOut();
    el("login").hidden = false;
    el("dashboard").hidden = true;
    return;
  }

  el("login").hidden = true;
  el("dashboard").hidden = false;

  await Promise.all([loadOrders(), loadBooks()]);
}

async function loadOrders() {
  el("msg").textContent = "جارٍ تحميل الطلبات...";

  const { data, error } = await db
    .from("orders")
    .select("id,customer_name,phone,city,address,total,status,created_at")
    .order("created_at", { ascending: false });

  if (error) {
    el("msg").textContent = "تعذر تحميل الطلبات: " + error.message;
    return;
  }

  el("msg").textContent = data.length
    ? `عدد الطلبات: ${data.length}`
    : "ما كاين حتى طلب دابا.";

  el("orders").replaceChildren();

  for (const order of data) {
    const card = document.createElement("article");
    card.className = "order";

    const heading = document.createElement("h3");
    heading.textContent = "طلب: " + order.id;
    card.appendChild(heading);

    const details = document.createElement("pre");
    details.textContent =
      `الزبون: ${order.customer_name}\n` +
      `الهاتف: ${order.phone}\n` +
      `المدينة: ${order.city}\n` +
      `العنوان: ${order.address}\n` +
      `المجموع: ${order.total} درهم\n` +
      `الحالة: ${order.status}\n` +
      `التاريخ: ${new Date(order.created_at).toLocaleString("ar-MA")}`;

    card.appendChild(details);

    const itemsResult = await db
      .from("order_items")
      .select("book_title,price,quantity")
      .eq("order_id", order.id);

    if (itemsResult.error) {
      const err = document.createElement("p");
      err.textContent = "تعذر تحميل تفاصيل الكتب.";
      card.appendChild(err);
    } else {
      const items = document.createElement("p");
      items.textContent = "الكتب: " + itemsResult.data.map(
        item =>
          `${item.book_title} × ${item.quantity} (${item.price} درهم)`
      ).join("، ");

      card.appendChild(items);
    }

    if (order.status === "pending") {
      const actions = document.createElement("div");
      actions.className = "row";

      for (const [label, status, cls] of [
        ["قبول الطلب", "accepted", ""],
        ["رفض الطلب", "rejected", "reject"]
      ]) {
        const btn = document.createElement("button");
        btn.textContent = label;
        if (cls) btn.className = cls;
        btn.onclick = () => updateOrder(order.id, status, btn);
        actions.appendChild(btn);
      }

      card.appendChild(actions);
    }

    el("orders").appendChild(card);
  }
}

async function updateOrder(id, status, btn) {
  const question = status === "accepted"
    ? "واش متأكد بغيتي تقبل الطلب؟ غادي ينقص المخزون."
    : "واش متأكد بغيتي ترفض الطلب؟";

  if (!confirm(question)) return;

  btn.disabled = true;
  el("msg").textContent = "جارٍ تحديث الطلب...";

  try {
    const { error } = await db.rpc("admin_update_order", {
      p_order_id: id,
      p_new_status: status
    });

    if (error) {
      el("msg").textContent = "تعذر تحديث الطلب: " + error.message;
      return;
    }

    el("msg").textContent = "تم تحديث الطلب بنجاح.";
    await Promise.all([loadOrders(), loadBooks()]);
  } catch (error) {
    el("msg").textContent = "وقع خطأ أثناء تحديث الطلب.";
  } finally {
    btn.disabled = false;
  }
}

// تحميل الروايات
async function loadBooks() {
  el("booksMsg").textContent = "جارٍ تحميل الروايات...";

  const { data, error } = await db
    .from("books")
    .select("*")
    .order("id", { ascending: false });

  if (error) {
    el("booksMsg").textContent =
      "تعذر تحميل الروايات: " + error.message;
    return;
  }

  el("booksList").replaceChildren();
  el("booksMsg").textContent = `عدد الروايات: ${data.length}`;

  for (const book of data) {
    const card = document.createElement("article");
    card.className = "book-card";

    const title = document.createElement("h3");
    title.textContent = book.title;
    card.appendChild(title);

    const info = document.createElement("p");
    info.textContent =
      `الكاتب: ${book.author || "غير محدد"} | ` +
      `الثمن: ${book.price} درهم | ` +
      `المخزون: ${book.stock} | ` +
      `الحالة: ${book.active ? "معروضة" : "مخفية"}`;
    card.appendChild(info);

    const edit = document.createElement("button");
    edit.textContent = "تعديل";
    edit.onclick = () => {
      el("bookId").value = book.id;
      el("bookTitle").value = book.title || "";
      el("bookAuthor").value = book.author || "";
      el("bookPrice").value = book.price;
      el("bookStock").value = book.stock;
      el("bookCategory").value = book.category || "";
      el("bookImage").value = book.image_url || "";
      el("bookDescription").value = book.description || "";
      el("saveBookBtn").textContent = "حفظ التعديلات";
      el("booksMsg").textContent = "عدّل المعلومات ثم اضغط حفظ التعديلات.";
      el("bookForm").scrollIntoView({ behavior: "smooth" });
    };
    card.appendChild(edit);

    const toggle = document.createElement("button");
    toggle.className = "reject";
    toggle.textContent = book.active ? "إخفاء الرواية" : "إعادة عرضها";

    toggle.onclick = async () => {
      if (!confirm("واش متأكد بغيتي تغيّر حالة عرض هاد الرواية؟")) {
        return;
      }

      toggle.disabled = true;

      const { error } = await db
        .from("books")
        .update({ active: !book.active })
        .eq("id", book.id);

      toggle.disabled = false;

      if (error) {
        el("booksMsg").textContent =
          "تعذر تحديث الرواية: " + error.message;
        return;
      }

      el("booksMsg").textContent = "تحدّثات حالة الرواية بنجاح.";
      await loadBooks();
    };

    card.appendChild(toggle);
    el("booksList").appendChild(card);
  }
}

// إفراغ النموذج
function resetBookForm() {
  el("bookForm").reset();
  el("bookId").value = "";
  el("saveBookBtn").textContent = "إضافة الرواية";
}

// إضافة رواية أو تعديلها
el("bookForm").addEventListener("submit", async event => {
  event.preventDefault();

  const id = el("bookId").value;

  const book = {
    title: el("bookTitle").value.trim(),
    author: el("bookAuthor").value.trim(),
    price: Number(el("bookPrice").value),
    stock: Number(el("bookStock").value),
    category: el("bookCategory").value.trim(),
    image_url: el("bookImage").value.trim(),
    description: el("bookDescription").value.trim()
  };

  if (
    !book.title ||
    !Number.isFinite(book.price) ||
    book.price < 0 ||
    !Number.isInteger(book.stock) ||
    book.stock < 0
  ) {
    el("booksMsg").textContent =
      "راجع اسم الرواية والثمن والمخزون.";
    return;
  }

  const saveBtn = el("saveBookBtn");
  saveBtn.disabled = true;
  el("booksMsg").textContent = "جارٍ حفظ الرواية...";

  try { 
    const imageFile = el("bookImageFile").files[0];

if (imageFile) {
  if (!imageFile.type.startsWith("image/") ||
      imageFile.size > 5 * 1024 * 1024) {
    el("booksMsg").textContent =
      "اختار صورة صالحة وحجمها أقل من 5 ميغابايت.";
    return;
  }

  const safeName = imageFile.name.replace(/[^a-zA-Z0-9._-]/g, "_");
  const path = `${Date.now()}-${safeName}`;

  const { error: uploadError } = await db.storage
    .from("book-images")
    .upload(path, imageFile, {
      contentType: imageFile.type,
      upsert: false
    });

  if (uploadError) {
    el("booksMsg").textContent =
      "تعذر رفع الصورة: " + uploadError.message;
    return;
  }

  book.image_url = db.storage
    .from("book-images")
    .getPublicUrl(path).data.publicUrl;
}
    const result = id
      ? await db.from("books").update(book).eq("id", Number(id))
      : await db.from("books").insert({ ...book, active: true });

    if (result.error) {
      el("booksMsg").textContent =
        "تعذر حفظ الرواية: " + result.error.message;
      return;
    }

    el("booksMsg").textContent = "تحفظات الرواية بنجاح.";
    resetBookForm();
    await loadBooks();
  } catch (error) {
    el("booksMsg").textContent = "وقع خطأ أثناء حفظ الرواية.";
  } finally {
    saveBtn.disabled = false;
  }
});

db.auth.onAuthStateChange(() => {
  setTimeout(checkSession, 0);
});

checkSession();
</script>
</body>
</html>
